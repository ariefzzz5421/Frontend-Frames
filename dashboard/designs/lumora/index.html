<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02040d">
  <meta name="description" content="Lumora Cadet Skyranger: an interactive space character who follows your cursor and wears a glass helmet.">
  <title>Lumora — Cadet Skyranger</title>
  <link rel="preconnect" href="https://d2ol7oe51mr4n9.cloudfront.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@1,94,900&family=Urbanist:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* Hallmark · pre-emit critique: P4 H5 E4 S5 R4 V5 */
    :root{--space:#02040d;--white:#fff;--muted:#cdd2e6;--font-display:"Archivo",Impact,sans-serif;--font-ui:"Urbanist",Arial,sans-serif;--u:max(.069444vw,.123456vh)}
    *,*::before,*::after{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--space);color:var(--white);font-family:var(--font-ui)}
    button,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}:focus-visible{outline:2px solid var(--white);outline-offset:5px}
    .frame{position:fixed;width:calc(1440 * var(--u));height:calc(810 * var(--u));left:calc(50% - 720 * var(--u));top:calc(50% - 405 * var(--u));overflow:hidden;background:var(--space)}
    .plate{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .gaze{position:absolute;left:calc(510 * var(--u));top:calc(255 * var(--u));width:calc(435 * var(--u));height:calc(450 * var(--u));object-fit:fill;mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 72%,transparent 99%);opacity:0;transition:opacity .6s;pointer-events:none}
    .gaze.ready{opacity:1}
    .helmet{position:absolute;left:calc(533 * var(--u));top:calc(288 * var(--u));width:calc(360 * var(--u));height:calc(360 * var(--u));object-fit:fill;mix-blend-mode:screen;mask-image:linear-gradient(#000 0 76%,transparent 92%);opacity:0;transform:translateY(calc(-70 * var(--u))) scale(.94);transition:transform .72s cubic-bezier(.2,1.15,.2,1),opacity .56s;pointer-events:none}
    .helmet.on{opacity:1;transform:translateY(0) scale(1)}
    .brand{position:fixed;z-index:15;left:clamp(20px,3.9vw,55px);top:clamp(20px,6.6vh,54px);display:flex;align-items:center;gap:11px;font-size:clamp(22px,2.1vw,30px);font-weight:600;letter-spacing:-.06em}
    .brand-mark{width:35px;height:35px;border-radius:50%;background:conic-gradient(#22dded,#425bff,#b46cff,#ec80c8,#22dded);box-shadow:0 0 20px #6b7bff90}
    .menu{position:fixed;z-index:17;top:clamp(20px,6.6vh,54px);right:clamp(20px,3.9vw,55px);width:40px;height:40px;border:0;background:none;color:var(--white);display:grid;place-content:center;gap:5px}
    .menu span{width:25px;height:2px;background:currentColor;display:block;transition:transform .3s,opacity .3s}.menu[aria-expanded=true] span:first-child{transform:translateY(7px) rotate(45deg)}.menu[aria-expanded=true] span:nth-child(2){opacity:0}.menu[aria-expanded=true] span:last-child{transform:translateY(-7px) rotate(-45deg)}
    .menu-panel{position:fixed;z-index:16;right:clamp(20px,3.9vw,55px);top:clamp(75px,12vh,100px);padding:20px;min-width:210px;background:#101525;border:1px solid #ffffff44;box-shadow:0 20px 50px #0008;display:grid;gap:14px;font-weight:700}.menu-panel[hidden]{display:none}.menu-panel a:hover{text-decoration:underline}
    .copy{position:fixed;z-index:5;top:clamp(105px,15vh,132px);left:0;right:0;text-align:center;pointer-events:none}.eyebrow{display:block;font-size:clamp(13px,1.25vw,18px);font-weight:700;letter-spacing:.46em;color:var(--muted)}
    h1{margin:12px 0 0;font-family:var(--font-display);font-style:italic;font-weight:900;font-stretch:94%;font-size:clamp(52px,7vw,108px);line-height:.95;letter-spacing:-.025em;text-shadow:0 0 14px #fff9,0 0 34px #bfdcffd0,0 0 70px #4f77ffbd}
    .subtitle{margin:12px 0 0;font-size:clamp(16px,1.6vw,23px);font-weight:600;color:var(--muted)}
    .caption{position:fixed;z-index:11;bottom:clamp(22px,6.5vh,56px);font-size:clamp(10px,.9vw,13px);font-weight:700;letter-spacing:.08em;text-transform:uppercase}.caption.left{left:clamp(20px,3.9vw,55px)}.caption.right{right:clamp(20px,3.9vw,55px)}.caption.right a{border-bottom:1px solid #fff8;padding-bottom:4px}
    .push{position:absolute;z-index:11;left:calc(675 * var(--u));top:calc(720 * var(--u));width:calc(75 * var(--u));height:calc(75 * var(--u));border:calc(4 * var(--u)) solid #17263d;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ff686b 0,#ec1528 43%,#9f0018 85%);box-shadow:0 0 0 calc(2 * var(--u)) #ffffffa8,0 5px 16px #0009;color:#fff;font-size:calc(16.5 * var(--u));font-weight:700;line-height:.9;text-align:center;text-shadow:0 1px 2px #600;transition:transform .32s,box-shadow .32s}
    .push:hover{transform:scale(1.08)}.push:active{transform:scale(.88)}.push[aria-pressed=true]{box-shadow:0 0 0 calc(2 * var(--u)) #fff,0 0 24px 12px #e4274caa}
    .cursor-dot,.cursor-ring{position:fixed;z-index:30;pointer-events:none;left:-100px;top:-100px;border-radius:50%;display:none}.cursor-dot{width:7px;height:7px;background:#fff;margin:-3.5px}.cursor-ring{width:44px;height:44px;border:1.5px solid #fff;margin:-22px}
    @media(hover:hover) and (pointer:fine){html,body,button,a{cursor:none}.cursor-dot,.cursor-ring{display:block}}
    @media(max-width:820px){.brand{top:22px;left:20px}.menu{top:20px;right:20px}.copy{top:clamp(105px,15vh,150px)}h1{font-size:clamp(40px,11vw,64px)}.eyebrow{font-size:14px}.subtitle{font-size:16px}.caption{bottom:22px}.caption.left{left:20px}.caption.right{right:20px}.push{min-width:50px;min-height:50px;font-size:max(11px,calc(16.5 * var(--u)))}}
    @media(max-width:360px){.caption{font-size:9px}}
    @media(prefers-reduced-motion:reduce){.gaze{display:none}.helmet,.push,.menu span{transition:none}}
  </style>
</head>
<body>
  <div class="frame" id="frame" aria-label="Cadet Skyranger interactive scene">
    <img class="plate" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/a194141a-44ba-44bb-8372-e6720af994ca.jpg" alt="A young cartoon space cadet in white, orange and teal suit above a glowing planet horizon" fetchpriority="high">
    <video class="gaze" id="gaze" preload="auto" muted playsinline aria-hidden="true"></video>
    <img class="helmet" id="helmet" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e8c78660-4497-41b9-82ae-a4738a5edd11.jpg" alt="" aria-hidden="true">
    <button class="push" id="push" type="button" aria-label="Toggle cadet helmet" aria-pressed="false">PUSH<br>ME</button>
  </div>
  <a class="brand" href="../../" aria-label="Back to Frontend Frames"><span class="brand-mark" aria-hidden="true"></span>Lumora</a>
  <button class="menu" id="menu" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="menu-panel"><span></span><span></span><span></span></button>
  <nav class="menu-panel" id="menu-panel" aria-label="Page navigation" hidden><a href="../../">Frontend Frames ↗</a><a href="#cadet" id="about-link">About the cadet</a></nav>
  <header class="copy" id="cadet"><span class="eyebrow">CADET</span><h1>SKYRANGER</h1><p class="subtitle">Past the Stars and Further</p></header>
  <span class="caption left">3D Interaction</span><span class="caption right"><a href="../../">← Frontend Frames</a></span>
  <span class="cursor-dot" id="dot" aria-hidden="true"></span><span class="cursor-ring" id="ring" aria-hidden="true"></span>
  <script>
    (()=>{
      'use strict';
      const clip='https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/e1b48476-24ab-456a-bb12-13e63bc60973.mp4';
      const reduced=matchMedia('(prefers-reduced-motion: reduce)'),gaze=document.getElementById('gaze'),frame=document.getElementById('frame'),push=document.getElementById('push'),helmet=document.getElementById('helmet'),menu=document.getElementById('menu'),panel=document.getElementById('menu-panel');
      let duration=5,target=.5,shown=.5,lastMove=performance.now(),lastSeek=0,loaded=false,seeking=false;
      if(!reduced.matches){gaze.src=clip;gaze.addEventListener('loadedmetadata',()=>{duration=Math.max(0.1,gaze.duration-.04);loaded=true;gaze.currentTime=duration*.5});gaze.addEventListener('seeked',()=>{seeking=false;gaze.classList.add('ready')});gaze.addEventListener('error',()=>{loaded=false;seeking=false;gaze.classList.remove('ready')});}
      let frameRect=frame.getBoundingClientRect();addEventListener('resize',()=>{frameRect=frame.getBoundingClientRect()});
      function aim(x){const rect=frameRect;target=Math.max(0,Math.min(1,(x-rect.left-rect.width*.14)/(rect.width*.72)));lastMove=performance.now()}
      addEventListener('pointermove',e=>aim(e.clientX),{passive:true});
      push.addEventListener('click',()=>{const on=push.getAttribute('aria-pressed')!=='true';push.setAttribute('aria-pressed',String(on));helmet.classList.toggle('on',on);push.animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:320,easing:'ease-out'})});
      menu.addEventListener('click',()=>{const on=menu.getAttribute('aria-expanded')!=='true';menu.setAttribute('aria-expanded',String(on));menu.setAttribute('aria-label',on?'Close navigation':'Open navigation');panel.hidden=!on});
      document.getElementById('about-link').addEventListener('click',e=>{e.preventDefault();panel.hidden=true;menu.setAttribute('aria-expanded','false');document.querySelector('.copy').animate([{opacity:.4},{opacity:1}],{duration:500})});
      const fine=matchMedia('(hover:hover) and (pointer:fine)').matches,dot=document.getElementById('dot'),ring=document.getElementById('ring');let mx=-100,my=-100,rx=-100,ry=-100;if(fine)addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY},{passive:true});
      const frameMs=fine?1000/45:1000/30;let last=0;function tick(now){requestAnimationFrame(tick);if(document.hidden||now-last<frameMs)return;const dt=Math.min(.05,(now-(last||now))/1000);last=now;if(!reduced.matches&&loaded){if(now-lastMove>3500)target=.5+Math.sin(now*.00055)*.32;shown+=(target-shown)*(1-Math.exp(-dt*9));if(!seeking&&now-lastSeek>65&&Math.abs(gaze.currentTime-shown*duration)>.025){seeking=true;lastSeek=now;try{gaze.currentTime=Math.max(.01,Math.min(duration,shown*duration))}catch{seeking=false}}}if(fine){const f=1-Math.exp(-dt*18);rx+=(mx-rx)*f;ry+=(my-ry)*f;dot.style.transform=`translate(${mx}px,${my}px)`;ring.style.transform=`translate(${rx}px,${ry}px)`}}if(!reduced.matches||fine)requestAnimationFrame(tick);
      if(!reduced.matches){const a=(el,from,to,delay,duration=850)=>el.animate([{opacity:0,transform:from},{opacity:1,transform:to}],{duration,delay,easing:'cubic-bezier(.2,.8,.2,1)',fill:'both'});a(document.querySelector('.brand'),'translateY(-20px)','translateY(0)',0);a(menu,'translateY(-20px)','translateY(0)',80);a(document.querySelector('.eyebrow'),'translateY(20px)','translateY(0)',150);a(document.querySelector('h1'),'translateY(35px) scale(.97)','translateY(0) scale(1)',280,1100);a(document.querySelector('.subtitle'),'translateY(18px)','translateY(0)',700);a(push,'translateY(25px) scale(.7)','translateY(0) scale(1)',1000)}
    })();
  </script>
</body>
</html>
