<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e6e0cf">
  <meta name="description" content="Saltwake, an interactive illustrated voyage in two scenes.">
  <title>Saltwake — Tales of the Open Sea</title>
  <link rel="preconnect" href="https://images.higgs.ai">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&family=Sorts+Mill+Goudy&family=Josefin+Sans:wght@600&family=Open+Sans:wght@700&display=swap" rel="stylesheet">
  <style>
    /* Hallmark · pre-emit critique: P4 H5 E4 S5 R4 V5 */
    :root{--paper:#e6e0cf;--ink:#201c15;--line:#16130e;--band:#d7d2c2;--band2:#dcd7c7;--font-display:"Goudy Bookletter 1911",Georgia,serif;--font-eyebrow:"Sorts Mill Goudy",Georgia,serif;--font-action:"Josefin Sans",sans-serif;--font-ui:"Open Sans",sans-serif}
    *,*::before,*::after{box-sizing:border-box}
    html,body{height:100%;margin:0;overflow-x:clip;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
    body{overflow:hidden}
    button,a{font:inherit;color:inherit}
    button{cursor:pointer}
    a{text-decoration:none}
    :focus-visible{outline:3px solid var(--ink);outline-offset:5px}
    .frame{position:fixed;inset:14px;border-radius:34px;overflow:hidden;background:var(--paper);isolation:isolate}
    .frame::after{content:"";position:absolute;inset:0;border:6px solid var(--line);border-radius:34px;pointer-events:none;z-index:30}
    #scene{position:absolute;inset:0 auto auto 0;transform-origin:0 0}
    #scene>*{position:absolute}
    svg.w{left:0;top:0;overflow:visible;pointer-events:none}
    .spr{background-repeat:no-repeat;will-change:transform}
    #ship{background-size:100% 100%;transform-origin:50% 100%}
    #palm{transform-origin:22% 100%;clip-path:polygon(0 0,100% 0,100% 61%,46% 61%,46% 100%,0 100%)}
    .cloud{width:300px;height:80px;opacity:.75}
    .t1{left:150px;top:292px;width:640px;white-space:nowrap;z-index:2}
    .eb{display:block;font:400 27px/1 var(--font-eyebrow);letter-spacing:.2em;text-transform:uppercase}
    h1,h2{font-family:var(--font-display);font-weight:400;text-transform:uppercase;letter-spacing:-.045em;margin:0}
    h1{font-size:88px;line-height:.92;margin-top:26px}
    h2{font-size:72px;line-height:.98}
    .pill{display:inline-block;border:3px solid var(--line);border-radius:999px;background:#ece7d8;box-shadow:0 7px 0 -1px var(--paper),0 7px 0 2px var(--line);font:600 19px/1 var(--font-action);text-transform:uppercase;letter-spacing:.01em;transition:transform .25s,box-shadow .25s}
    .pill:hover{transform:translateY(3px);box-shadow:0 4px 0 -1px var(--paper),0 4px 0 2px var(--line)}
    .t1 .pill{margin-top:40px;padding:21px 62px 17px}
    .t2{left:1000px;top:462px;width:520px;z-index:12;opacity:0;pointer-events:none}
    .t2 p{margin:22px 0 0;font:700 14.5px/1.72 var(--font-ui);letter-spacing:.13em;text-transform:uppercase}
    .btnw{display:inline-block;position:relative;margin-top:30px}
    .t2 .pill{font-size:16px;padding:15px 38px 12px}
    .tick{position:absolute;top:-15px;width:22px;height:4px;border-radius:2px;background:var(--line)}
    .tick.a{left:-30px;transform:rotate(24deg)}.tick.b{left:-16px;top:-23px;width:13px;transform:rotate(58deg)}.tick.c{right:-30px;transform:rotate(-30deg)}
    .logo{position:absolute;left:6.6%;top:58px;z-index:21;display:flex;align-items:center;gap:9px;font:400 30px/1 var(--font-display);letter-spacing:-.03em}
    .logo svg{width:26px;height:30px}
    nav{position:absolute;right:5.4%;top:62px;z-index:21;display:flex;gap:clamp(24px,5vw,90px)}
    nav a{position:relative;font:700 12.5px/1 var(--font-ui);letter-spacing:.17em;text-transform:uppercase;padding:6px 0;white-space:nowrap}
    nav a:hover{text-decoration:underline;text-underline-offset:6px}
    .collection{position:absolute;z-index:22;bottom:37px;right:5.4%;font:700 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--ink);padding-bottom:5px}
    .scene-hint{position:absolute;z-index:22;bottom:37px;left:6.6%;font:700 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase}
    #shade{position:absolute;left:-12%;top:-12%;width:124%;height:124%;mix-blend-mode:multiply;opacity:.4;pointer-events:none;z-index:25;will-change:transform}
    #cur,#ping{position:fixed;left:0;top:0;z-index:50;pointer-events:none;border-radius:50%;display:none}
    .fine,.fine *{cursor:none!important}.fine #cur,.fine #ping{display:block}
    #cur{width:40px;height:40px;margin:-20px;border:5px solid var(--line)}
    #ping{width:40px;height:40px;margin:-20px;border:1.5px solid var(--line);opacity:0}
    .portrait .t1{left:60px;top:190px;width:680px}.portrait h1{font-size:98px}.portrait .t1 .eb{font-size:32px}.portrait .t1 .pill{font-size:26px;padding:27px 74px 22px}
    .portrait .t2{left:64px;top:1036px;width:680px}.portrait h2{font-size:96px}.portrait .t2 p{font-size:21px}.portrait .t2 .pill{font-size:24px;padding:22px 52px 18px}.portrait #shade{opacity:.26}
    @media(max-width:760px){.frame,.frame::after{border-radius:22px}.frame{inset:8px}.logo{top:25px;left:8%;font-size:22px}.logo svg{width:20px;height:23px}nav{right:8%;top:29px;gap:14px}nav a{font-size:9.5px;letter-spacing:.08em}nav a:nth-child(n+3){display:none}.collection{right:8%;bottom:30px;font-size:9px}.scene-hint{left:8%;bottom:30px;font-size:9px}}
    @media(prefers-reduced-motion:reduce){.pill{transition:none}}
  </style>
</head>
<body>
  <main class="frame" id="frame" aria-label="Saltwake interactive voyage">
    <a class="logo" href="#" data-go="0" aria-label="Saltwake, return to the open sea"><svg viewBox="0 0 26 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="13" cy="4.5" r="2.8"/><path d="M13 7.5V28M7 12h12M2.5 19c.6 5.5 5.5 9 10.5 9s9.9-3.5 10.5-9"/></svg>Saltwake</a>
    <nav aria-label="Voyage navigation"><a href="#" data-go="0">Voyages</a><a href="#" data-go="1">Crew</a><a href="#" data-go="1">Charts</a><a href="../../">Archive ↗</a></nav>
    <div id="scene">
      <div class="cloud" id="cloud" aria-hidden="true"><svg viewBox="0 0 300 80" width="300" height="80"><path fill="#d3cebe" d="M0 79c14-3 26-3 38-10-4-16 10-30 30-26 6-22 42-34 62-16 16-12 42-6 50 14 10-2 18 2 22 8 24 22 66 26 98 30z"/></svg></div>
      <svg class="w" id="wBack" aria-hidden="true"></svg>
      <div class="t1" id="t1"><span class="eb">Port Royal</span><h1>Tales of<br>the open sea</h1><a class="pill" href="#" data-go="1">Set sail</a></div>
      <div class="spr" id="ship" role="img" aria-label="Illustrated pirate galleon sailing the open sea"></div>
      <svg class="w" id="wFront" aria-hidden="true"></svg>
      <div class="spr" id="palm" aria-hidden="true"></div><div class="spr" id="capt" role="img" aria-label="Pirate captain with a telescope"></div><div class="spr" id="chest" aria-hidden="true"></div><div class="spr" id="bushL" aria-hidden="true"></div><div class="spr" id="bushR" aria-hidden="true"></div>
      <div class="t2" id="t2"><h2>Rules of<br>the crew</h2><p>Every sailor signed the articles<br>before the anchor came up.</p><span class="btnw"><i class="tick a"></i><i class="tick b"></i><i class="tick c"></i><a class="pill" href="#" data-go="0">Voyage again</a></span></div>
    </div>
    <canvas id="shade" width="64" height="36" aria-hidden="true"></canvas>
    <span class="scene-hint" id="sceneHint">Scroll or select “Set sail”</span>
    <a class="collection" href="../../">← Frontend Frames</a>
  </main>
  <div id="ping" aria-hidden="true"></div><div id="cur" aria-hidden="true"></div>
  <script>
    (()=>{
      'use strict';
      const P='https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_';
      const SHIP=P+'20261031_024714_39df675e-5060-4528-87dc-9d0c274815aa.png&w=1600&q=90';
      const CAPT=P+'20261031_024703_a0298b6a-0117-47f1-8462-4be671d0407e.png&w=2048&q=90';
      const PLANTS=P+'20261031_024704_3ccf1ac2-bec7-4fdb-bfce-ac19eca8db28.png&w=2048&q=90';
      const BOX={capt:[CAPT,34,153,1246,1074],chest:[CAPT,1475,830,446,392],palm:[PLANTS,19,32,910,1284],bushL:[PLANTS,515,820,860,496],bushR:[PLANTS,1528,908,499,405]};
      const LAY={land:{w:1600,h:900,wave:{y0:748,y1:272,gap0:1,gap1:.6},ship:{x0:1130,w0:710,x1:1345,w1:176},palm:{x:-92,y:-112,w:620},capt:{x:120,y:318,w:540},chest:{x:640,y:628,w:200},bushL:{x:96,y:716,w:700},bushR:{x:1370,y:740,w:300}},port:{w:800,h:1500,wave:{y0:1300,y1:430,gap0:1,gap1:.7},ship:{x0:420,w0:620,x1:640,w1:150},palm:{x:-150,y:-60,w:560},capt:{x:20,y:440,w:600},chest:{x:560,y:830,w:190},bushL:{x:-40,y:1330,w:520},bushR:{x:570,y:1340,w:260}}};
      const BACK=[{dy:-100,a:20,k:1.5,v:.9,ph:0,fill:'var(--band)'},{dy:-52,a:23,k:1.9,v:1.15,ph:1.7,fill:'var(--paper)'}];
      const FRONT=[{dy:0,a:25,k:1.7,v:1.3,ph:3.1,fill:'var(--band2)'},{dy:26,a:18,k:2.4,v:1,ph:4.4,span:[.06,.44]},{dy:48,a:22,k:1.45,v:1.4,ph:.6,fill:'var(--paper)'},{dy:76,a:15,k:2.1,v:1.2,ph:5.1,span:[.52,.97]},{dy:104,a:24,k:1.8,v:1.25,ph:2.2,fill:'var(--paper)'},{dy:130,a:14,k:2.7,v:1,ph:1.1,span:[0,.62]},{dy:158,a:20,k:1.6,v:1.1,ph:3.8}];
      const frame=document.querySelector('#frame'),scene=document.querySelector('#scene'),ship=document.querySelector('#ship'),shade=document.querySelector('#shade'),hint=document.querySelector('#sceneHint'),wBack=document.querySelector('#wBack'),wFront=document.querySelector('#wFront'),cloud=document.querySelector('#cloud'),one=document.querySelector('#t1'),two=document.querySelector('#t2'),logo=document.querySelector('.logo'),twoHeading=two.querySelector('h2'),twoCopy=two.querySelector('p'),twoButton=two.querySelector('.btnw');
      const els=Object.fromEntries(Object.keys(BOX).map(id=>[id,document.getElementById(id)]));
      const reduced=matchMedia('(prefers-reduced-motion: reduce)');
      const clamp=x=>Math.max(0,Math.min(1,x)),mix=(a,b,t)=>a+(b-a)*t,seg=(x,a,b)=>clamp((x-a)/(b-a)),io=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2,out=k=>1-Math.pow(1-k,3),back=k=>1+2.4*Math.pow(k-1,3)+1.4*Math.pow(k-1,2);
      let L=LAY.land,S=1,p=0,pFrom=0,pTo=0,pT0=0,locked=0,t0=performance.now();
      function setSprite(id){const [url,x,y,w,h]=BOX[id],el=els[id],c=L[id];el.style.left=c.x+'px';el.style.top=c.y+'px';el.style.width=c.w+'px';el.style.height=c.w*h/w+'px';el.style.backgroundImage='url("'+url+'")';el.style.backgroundSize=(2048/w*100)+'% '+(1360/h*100)+'%';el.style.backgroundPosition=(x/(2048-w)*100)+'% '+(y/(1360-h)*100)+'%'}
      function resize(){const W=frame.clientWidth,H=frame.clientHeight;L=H>W?LAY.port:LAY.land;document.documentElement.classList.toggle('portrait',H>W);S=Math.min(W/L.w,H/L.h);const dx=(W/S-L.w)/2,dy=(H/S-L.h)/2;scene.style.width=L.w+'px';scene.style.height=L.h+'px';scene.style.transform=`translate(${dx*S}px,${dy*S}px) scale(${S})`;for(const svg of document.querySelectorAll('.w')){svg.setAttribute('viewBox',`0 0 ${L.w} ${L.h}`);svg.setAttribute('width',L.w);svg.setAttribute('height',L.h)}for(const id of Object.keys(BOX))setSprite(id)}
      function yAt(l,x,t,q){const w=L.wave,base=mix(w.y0,w.y1,q)+l.dy*mix(w.gap0,w.gap1,q),a=l.a*mix(1,.72,q),f=Math.PI*2/1100*l.k*(1-.35*q);return base+a*Math.sin(f*x+t*l.v+l.ph)+a*.45*Math.sin(f*2.3*x-t*l.v*.7+l.ph*1.7)}
      function prepare(svg,layers){for(const l of layers){const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('fill',l.fill||'none');path.setAttribute('stroke','var(--line)');path.setAttribute('stroke-width','3.2');path.setAttribute('stroke-linecap','round');svg.append(path)}}
      function draw(svg,layers,t){for(let i=0;i<layers.length;i++){const l=layers[i],a=l.span?l.span[0]*L.w:0,b=l.span?l.span[1]*L.w:L.w;let d='M'+a.toFixed(1)+' '+yAt(l,a,t,p).toFixed(1);for(let x=a+22;x<=b+22;x+=22){const X=Math.min(x,b);d+=' L'+X.toFixed(1)+' '+yAt(l,X,t,p).toFixed(1);if(X===b)break}if(l.fill)d+=` L${b} ${L.h} L${a} ${L.h} Z`;svg.children[i].setAttribute('d',d)}}
      function go(to){if(Math.abs(to-pTo)<.01)return;pFrom=p;pTo=to;pT0=performance.now();hint.textContent=to?'Scroll up to return':'Scroll or select “Set sail”'}
      document.querySelectorAll('[data-go]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(Number(a.dataset.go))}));
      frame.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)<8||performance.now()<locked)return;go(e.deltaY>0?1:0);locked=performance.now()+1200},{passive:true});
      addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='PageDown')go(1);if(e.key==='ArrowUp'||e.key==='PageUp')go(0)});
      const ctx=shade.getContext('2d');ctx.scale(.5,.5);ctx.fillStyle='#fff';ctx.fillRect(0,0,128,72);ctx.strokeStyle='rgba(120,114,96,.9)';ctx.lineCap='round';for(const [x0,y0,x1,y1,w] of [[-10,26,38,-8,8],[-8,46,58,-2,5],[-10,62,74,6,4],[14,78,96,16,4],[40,82,118,22,3],[78,80,140,34,5],[-12,74,22,56,6]]){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x0,y0);ctx.quadraticCurveTo((x0+x1)/2+6,(y0+y1)/2+8,x1,y1);ctx.stroke()}
      const fine=matchMedia('(hover:hover) and (pointer:fine)').matches,cur=document.getElementById('cur'),ping=document.getElementById('ping');let mx=-100,my=-100,cx=-100,cy=-100,down=false,pingAt=0,px=0,py=0;
      if(fine){document.documentElement.classList.add('fine');addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY});addEventListener('pointerdown',e=>{down=true;pingAt=performance.now();px=e.clientX;py=e.clientY});addEventListener('pointerup',()=>down=false)}
      const frameMs=matchMedia('(pointer:coarse)').matches?1000/30:1000/45;
      function render(now){requestAnimationFrame(render);if(document.hidden||(render.lastPaint&&now-render.lastPaint<(reduced.matches&&p===pTo?1000:frameMs)))return;const dt=Math.min(.05,(now-(render.lastPaint||now))/1000);render.lastPaint=now;if(p!==pTo){const k=seg(now,pT0,pT0+(reduced.matches?1:2100));p=mix(pFrom,pTo,io(k));if(k>=1)p=pTo}const t=reduced.matches?0:(now-t0)/1000;draw(wBack,BACK,t);draw(wFront,FRONT,t);
        const c=L.ship,sw=mix(c.w0,c.w1,p),sx=mix(c.x0,c.x1,p),sh=sw*2002/1961,wy=yAt(FRONT[0],sx,t,p),slope=(yAt(FRONT[0],sx+90,t,p)-yAt(FRONT[0],sx-90,t,p))/180;ship.style.width=sw+'px';ship.style.height=sh+'px';ship.style.left=(sx-sw/2)+'px';ship.style.top=(wy+sw*.05-sh)+'px';ship.style.transform=`rotate(${Math.atan(slope)*57.3*.75}deg)`;
        cloud.style.left=(((L.w*.72-t*16)%(L.w+700))-400)+'px';cloud.style.top=(L===LAY.port?110:150)+'px';cloud.style.opacity=1-seg(p,.3,.7);
        const intro=out(seg(now,t0+200,t0+1100));one.style.opacity=intro*(1-seg(p,.62,.7));one.style.transform=`translateY(${(1-intro)*26-p*40}px)`;one.style.pointerEvents=p>.1?'none':'auto';logo.style.opacity=1-seg(p,.12,.3);
        const e=io(seg(p,.04,.92)),b=out(seg(p,.5,1));els.palm.style.transform=`translate(${mix(-L.palm.w-80,0,e)}px,${mix(-170,0,e)}px) rotate(${Math.sin(t*.8)*.7}deg)`;els.capt.style.transform=`translateX(${mix(-L.capt.w-160,0,e)}px) rotate(${Math.sin(t*1.1)*.5*p}deg)`;els.chest.style.transform=`translate(${mix(-L.chest.w-720,0,e)}px,${mix(120,0,e)}px)`;els.bushL.style.transform=`translateY(${mix(340,0,b)}px)`;els.bushR.style.transform=`translateY(${mix(300,0,b)}px)`;
        const hk=seg(p,.42,.82),pk=seg(p,.76,.92),bk=seg(p,.86,1);two.style.opacity=hk*hk;twoHeading.style.transform=`translateY(${mix(70,0,out(hk))}px)`;twoCopy.style.opacity=pk;twoCopy.style.transform=`translateY(${mix(16,0,pk)}px)`;twoButton.style.opacity=bk;twoButton.style.transform=`scale(${mix(.7,1,back(bk))})`;two.style.pointerEvents=p>.9?'auto':'none';shade.style.transform=`translate(${Math.sin(t*.35)*2.2}%,${Math.cos(t*.27)*1.6}%) rotate(${Math.sin(t*.22)*.8}deg)`;
        if(fine){const f=1-Math.exp(-dt*22);cx+=(mx-cx)*f;cy+=(my-cy)*f;cur.style.transform=`translate(${cx}px,${cy}px) scale(${down?.7:document.elementFromPoint(mx,my)?.closest('a,button')?1.35:1})`;const k=seg(now,pingAt,pingAt+650);ping.style.transform=`translate(${px}px,${py}px) scale(${1+out(k)*1.9})`;ping.style.opacity=pingAt?1-k:0}}
      ship.style.backgroundImage='url("'+SHIP+'")';prepare(wBack,BACK);prepare(wFront,FRONT);resize();addEventListener('resize',resize);requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
