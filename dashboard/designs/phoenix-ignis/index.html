    stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;lastX=e.clientX;lastY=e.clientY;velX=velY=0;stage.setPointerCapture(e.pointerId);stage.classList.add('dragging');touched()});stage.addEventListener('pointermove',e=>{if(!drag)return;const k=Math.PI/Math.max(260,view.px*1.6),dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;velX=dx*k;velY=dy*k;if(rigs[active]){rigs[active].spin.rotation.y+=velX;rigs[active].spin.rotation.x=clamp(rigs[active].spin.rotation.x+velY,-1.4,1.4)}});stage.addEventListener('pointerup',()=>{drag=false;stage.classList.remove('dragging')});stage.addEventListener('pointercancel',()=>{drag=false;stage.classList.remove('dragging')});stage.addEventListener('wheel',e=>{e.preventDefault();setZoom(zoomGoal*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)))},{passive:false});stage.addEventListener('dblclick',()=>reset());function reset(){setZoom(1);const r=rigs[active];if(r)r.spin.rotation.set(creatures[active].pitch,creatures[active].yaw,0);velX=velY=yawQueue=0}stage.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){yawQueue+=(e.key==='ArrowLeft'?-1:1)*.18;touched();e.preventDefault()}if(e.key==='+'||e.key==='=')setZoom(zoomGoal*1.2);if(e.key==='-')setZoom(zoomGoal/1.2);if(e.key==='0')reset();if(e.key==='Escape'&&focus)toggleFocus(false)});$('#zoomIn').onclick=()=>setZoom(zoomGoal*1.35);$('#zoomOut').onclick=()=>setZoom(zoomGoal/1.35);$('#turnL').onclick=()=>{yawQueue-=Math.PI/2;touched()};$('#turnR').onclick=()=>{yawQueue+=Math.PI/2;touched()};$('#turnFull').onclick=()=>{yawQueue+=Math.PI*2;touched()};$('#expand').onclick=()=>toggleFocus();$('#focusExit').onclick=()=>toggleFocus(false);$('#light').onclick=()=>{const dusk=hero.dataset.light!=='dusk';hero.dataset.light=dusk?'dusk':'day';$('#light').classList.toggle('on',dusk);$('#light').setAttribute('aria-pressed',String(dusk));$('#light').setAttribute('aria-label',dusk?'Switch to daylight':'Switch to dusk lighting');touche
